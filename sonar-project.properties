# SonarCloud project configuration for pvemanager (monorepo)
# Place this file at the repository root.

sonar.organization=markmorado
sonar.projectKey=markmorado_pvemanager
sonar.projectName=PVEmanager

# --- Sources ---
# Backend: FastAPI app under backend/app
# Frontend: React/TS app under frontend/src
sonar.sources=backend/app,frontend/src

# Tests are scanned separately so they show up as "Tests", not "Code"
sonar.tests=backend/tests

# --- Exclusions (things we never want analyzed) ---
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  backend/alembic/versions/**,\
  backend/migrations/**,\
  frontend/public/**,\
  **/*.min.js,\
  **/locales/**,\
  **/static/**

# Don't compute duplication/complexity noise on generated or vendored files
sonar.coverage.exclusions=\
  backend/alembic/**,\
  backend/migrations/**,\
  backend/tests/**,\
  frontend/src/**/*.test.ts,\
  frontend/src/**/*.test.tsx,\
  **/*.d.ts

# --- Python (backend) ---
sonar.python.version=3.12
# Matches the coverage.xml already produced by backend-tests.yml
sonar.python.coverage.reportPaths=backend/coverage.xml

# --- TypeScript/JavaScript (frontend) ---
# If you later add vitest/jest with lcov coverage, point this at the report:
# sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.eslint.reportPaths=frontend/eslint-report.json

# --- Source encoding ---
sonar.sourceEncoding=UTF-8
