services:
  db:
    image: postgres:16-alpine
    container_name: pvemanager-db
    environment:
      POSTGRES_DB: pvemanager
      POSTGRES_USER: pvemanager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pvemanager_secure_password}
      TZ: ${TZ:-Asia/Tashkent}
      # Оптимизация для быстрого старта
      POSTGRES_INITDB_ARGS: "--no-sync"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pvemanager -d pvemanager"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - pvemanager-network
    # Оптимизация производительности БД (>- склеит в одну строку через пробел)
    command: >-
      postgres
      -c shared_buffers=256MB
      -c max_connections=200
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c effective_cache_size=512MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c random_page_cost=1.1

  app:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    image: pvemanager-app:latest
    pull_policy: build
    container_name: pvemanager-app
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ~/.ssh:/root/.ssh:ro
      - ./logs:/app/logs
      - ./VERSION:/app/VERSION:ro
      - /etc/localtime:/etc/localtime:ro
      # For system updates
      - .:/project:rw
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://pvemanager:${POSTGRES_PASSWORD:-pvemanager_secure_password}@db:5432/pvemanager
      - PYTHONPATH=/app
      - TZ=${TZ:-Asia/Tashkent}
      - PROJECT_ROOT=/project
      # Отключить проверку обновлений для приватных репозиториев
      - DISABLE_UPDATE_CHECK=${DISABLE_UPDATE_CHECK:-false}
      # GitHub token для доступа к приватным репозиториям (опционально)
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      # Оптимизация для production
      - UVICORN_WORKERS=1
      - UVICORN_TIMEOUT_KEEP_ALIVE=30
    networks:
      - pvemanager-network
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    # Ограничение ресурсов для стабильности
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: pvemanager-frontend:latest
    pull_policy: build
    container_name: pvemanager-frontend
    ports:
      - "3001:80"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pvemanager-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

volumes:
  db_data:
  logs:

networks:
  pvemanager-network:
    driver: bridge
