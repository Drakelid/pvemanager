services:
  db:
    build:
      context: .
      dockerfile: postgres.Dockerfile
    image: pvemanager-db:latest
    pull_policy: build
    environment:
      POSTGRES_DB: pvemanager
      POSTGRES_USER: pvemanager
      # Coolify generates and persists this value on the first deployment.
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
      TZ: ${TZ:-Europe/Oslo}
      # Оптимизация для быстрого старта
      POSTGRES_INITDB_ARGS: "--no-sync"
    volumes:
      - db_data_v2:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pvemanager -d pvemanager"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - pvemanager-network
    # Оптимизация производительности БД (>- склеит в одну строку через пробел)
    command: >-
      postgres
      -c shared_buffers=256MB
      -c max_connections=200
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c effective_cache_size=512MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c random_page_cost=1.1

  app:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    image: pvemanager-app:latest
    pull_policy: build
    # The API remains private. Coolify exposes the frontend, whose nginx
    # proxies API traffic to app:8000 over the deployment's private network.
    # No host port means no port-8000 collision between deployments.
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - logs:/app/logs
      # App Store: кэш логотипов/данных каталога (persist across rebuilds)
      - appstore_data:/app/data
    environment:
      DATABASE_URL: postgresql://pvemanager:${SERVICE_PASSWORD_64_POSTGRES}@db:5432/pvemanager
      SECRET_KEY: ${SERVICE_HEX_64_APP}
      ADMIN_PASSWORD: ${SERVICE_PASSWORD_64_ADMIN}
      # Fernet requires a URL-safe base64-encoded 32-byte key.
      FERNET_KEY: ${SERVICE_REALBASE64_32_FERNET}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      PYTHONPATH: /app
      TZ: ${TZ:-Europe/Oslo}
      DISABLE_UPDATE_CHECK: ${DISABLE_UPDATE_CHECK:-true}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      UVICORN_WORKERS: "1"
      UVICORN_TIMEOUT_KEEP_ALIVE: "30"
    restart: unless-stopped
    networks:
      - pvemanager-network
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 120s
    # Ограничение ресурсов для стабильности
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: pvemanager-frontend:latest
    pull_policy: build
    # Assign the public domain to this service in Coolify.
    expose:
      - "80"
    environment:
      # Creates a persistent generated domain and routes it to this service.
      SERVICE_URL_FRONTEND: /
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pvemanager-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

volumes:
  db_data_v2:
  logs:
  appstore_data:

networks:
  pvemanager-network:
    driver: bridge
